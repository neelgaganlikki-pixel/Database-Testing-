[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    database: Database schema, CRUD, constraint, join, transaction and integrity tests
    api: REST API automation tests
    ui: Playwright UI tests using Page Object Model
    integration: API-to-DB, UI-to-DB, and End-to-End order tests
    regression: Comprehensive regression test suite
    smoke: Smoke test suite for critical path verification
    transaction: Database transaction COMMIT and ROLLBACK tests
    self_healing: Self-healing automation engine tests for API and Database layers

addopts = 
    -v
    --strict-markers
    --html=reports/pytest-report.html
    --self-contained-html
    --junitxml=reports/junit-results.xml

log_cli = true
log_cli_level = INFO
log_cli_format = [%(asctime)s] [%(levelname)s] [%(name)s] - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
